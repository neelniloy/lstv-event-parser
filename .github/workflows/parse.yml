name: Parse Live Events and Update R2

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: parse-and-upload
  cancel-in-progress: true

jobs:
  parse-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: go.sum

      - name: Build Binary
        run: |
          go build -ldflags="-s -w" -o event-parser main.go

      - name: Run Event Parser & Upload to R2
        env:
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME || secrets.R2_BUCKET_NAME }}
        run: |
          ./event-parser
